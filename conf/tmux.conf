# pit's private tmux server config (tmux -L pit). Never loaded by your normal tmux.
# Must stay valid on tmux 3.2a (Rocky/RHEL 9): no popup -T/-b, no allow-passthrough,
# no pane-border-indicators, no extended-keys-format.

# Prefix is C-g so pit nests cleanly inside a normal tmux that uses C-b.
unbind C-b
set -g prefix C-g
bind C-g send-prefix

set -g escape-time 15
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse off
set -g focus-events on
set -g set-clipboard on
set -g window-size latest
set -g detach-on-destroy off
set -g renumber-windows on
set -g bell-action any
set -g visual-bell off

# Keys that Windows Terminal does not intercept (it takes F11, alt+enter, ctrl+shift+*).
bind -n F12 switch-client -t =pit-home
bind -n F10 run-shell -b "$PIT_HOME/bin/pit next"
bind -n F9  switch-client -l

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour214"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=colour214,fg=colour232,bold] PIT #[default] #S "
set -g status-right "#[fg=colour245]F12 home  F10 next alert  F9 last  C-g d detach #[fg=colour214]%H:%M "
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour214"
set -g message-style "bg=colour214,fg=colour232"
